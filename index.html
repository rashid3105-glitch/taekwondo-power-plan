    <!-- Organization + SoftwareApplication schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Sportstalent",
      "applicationCategory": "SportsApplication",
      "operatingSystem": "Web",
      "description": "Sikker, GDPR-klar platform til danske sportsklubber. Træningsplaner, dagbog, tests og trænerdashboard ét sted — bygget af en træner med 40 år i sporten.",
      "url": "https://sportstalent.dk",
      "inLanguage": ["da", "en", "sv", "no", "de", "es", "ar"],
      "offers": {
        "@type": "Offer",
        "price": "7500",
        "priceCurrency": "DKK",
        "description": "Årlig klublicens for op til 50 medlemmer. Moms inkluderet."
      },
      "author": {
        "@type": "Organization",
        "name": "Sportstalent",
        "url": "https://sportstalent.dk"
      }
    }
    </script>

    <!-- FAQ structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Hvad koster det for hele klubben?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "7.500 kr. om året for op til 50 medlemmer og 12.000 kr. om året for 51-100 medlemmer. Moms er inkluderet, og der faktureres én gang om året. Atleter og forældre betaler ingenting - licensen dækker hele klubben. Er I større end 100 medlemmer, laver vi en aftale."
          }
        },
        {
          "@type": "Question",
          "name": "Hvordan håndterer I data om medlemmer under 18?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sundhedsfunktioner åbner først, når en værge har givet samtykke. Træneren ser træning, fremmøde og det, atleten selv deler. Værgen kan følge sit eget barn. Vi følger GDPR, og data opbevares på servere i EU."
          }
        },
        {
          "@type": "Question",
          "name": "Hvor lang tid tager det at komme i gang?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "I opretter klubben og sender et invitationslink til hver atlet. Der er ingen installation og intet it-projekt. En træner kan få et helt hold på plads på en eftermiddag."
          }
        },
        {
          "@type": "Question",
          "name": "Skal vores trænere lære et nyt system?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Trænerens daglige brug er én skærm: dagens hold, logs og advarsler. Atletens daglige brug er en log på 30 sekunder. Alt det øvrige - planer, tests og rapporter - bruger I, når I har brug for det."
          }
        },
        {
          "@type": "Question",
          "name": "Virker det for vores sportsgren?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "I dag kører platformen med taekwondo, karate, kickboxing og fitness. Er jeres sportsgren ikke på listen, kan I stadig bruge planer, dagbog, tests og trænerdashboard - og vi tilføjer sportsspecifikt indhold i dialog med jer."
          }
        },
        {
          "@type": "Question",
          "name": "Hvad sker der med vores data, hvis vi stopper?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "I kan til enhver tid eksportere klubbens data. Siger I op, sletter vi data efter aftale og senest når opbevaringsfristen udløber. Vi sælger ikke data og bruger dem ikke til andet end at drive platformen."
          }
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Defensive blank-screen fallback: if React hasn't mounted anything
      // into #root after 5s (e.g. a native plugin bridge hangs at boot),
      // show a minimal message with a reload button so the user isn't
      // stuck on an empty dark screen.
      setTimeout(function () {
        var root = document.getElementById("root");
        if (!root || root.childElementCount > 0) return;
        root.innerHTML =
          '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;color:#e5e7eb;background:#0F172A;text-align:center;">' +
          '<div style="font-weight:700;font-size:18px;margin-bottom:8px;">Sportstalent</div>' +
          '<div style="font-size:14px;opacity:0.8;margin-bottom:20px;max-width:320px;">Appen kunne ikke starte. Tjek din internetforbindelse og pr\u00f8v igen.</div>' +
          '<button onclick="location.reload()" style="background:#F5C842;color:#0F172A;font-weight:600;border:0;border-radius:8px;padding:10px 20px;font-size:14px;">Genindl\u00e6s</button>' +
          '</div>';
      }, 5000);
    </script>
  </body>

</html>
